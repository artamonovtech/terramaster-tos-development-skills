name: Update TOS Documentation References

on:
  schedule:
    # Run weekly on Thursdays at 06:00 UTC
    # (upstream tos-app-pkg-tools changes much less often than nixpkgs)
    - cron: '0 6 * * 4'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate references from upstream
        run: bash scripts/generate-references.sh

      - name: Validate skill
        run: |
          npx --yes skills-ref@0.1.5 validate skills/terramaster-tos-development-skills
          LINES=$(wc -l < skills/terramaster-tos-development-skills/SKILL.md)
          echo "SKILL.md lines: $LINES"
          if [ "$LINES" -ge 500 ]; then
            echo "ERROR: SKILL.md must stay under the 500-line limit"
            exit 1
          fi

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain skills/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          source skills/terramaster-tos-development-skills/references/.source-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/
          COMMIT_MSG="docs: update references (tos-app-pkg-tools ${source_commit})"
          git commit -m "$COMMIT_MSG"
          git push
